name: Daily Reel
run-name: ReelAgent ${{ inputs.request_id || github.run_id }}
on:
  schedule:
    # Render 43 minutes before publication (UTC+3). Verify seven minutes afterwards.
    - cron: '17 4 * * *'
    - cron: '17 8 * * *'
    - cron: '17 13 * * *'
    - cron: '7 5 * * *'
    - cron: '7 9 * * *'
    - cron: '7 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'generate = preview only; run = create and schedule; verify = check Buffer'
        type: choice
        options: [generate, run, verify]
        default: generate
      slot:
        description: 'Optional UTC+3 slot, e.g. 2026-09-28-08'
        type: string
        required: false
      request_id:
        description: 'Identifier from launcher'
        type: string
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: reelagent-daily
  cancel-in-progress: false
jobs:
  reel:
    if: github.event_name != 'schedule' || vars.DAILY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ENV: cloud
      CONTENT_MODE: prompt_queue
      PROMPT_QUEUE_FILE: prompts/current-week.json
      GH_TOKEN: ${{ github.token }}
      MEDIA_PROVIDER: nasa
      TTS_VOICE: ru-RU-DmitryNeural
      DRY_RUN: 'true'
      AUTO_PUBLISH_YOUTUBE: 'false'
      AUTO_PUBLISH_INSTAGRAM: ${{ (github.event_name == 'schedule' || inputs.mode == 'run' || inputs.mode == 'verify') && vars.AUTO_PUBLISH_INSTAGRAM == 'true' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      INSTAGRAM_USERNAME: mateushstameska
      VERIFY_ONLY: ${{ startsWith(github.event.schedule, '7 ') || inputs.mode == 'verify' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Choose publication slot
        env:
          REQUESTED_SLOT: ${{ inputs.slot }}
          SCHEDULE_EVENT: ${{ github.event.schedule }}
        run: python -m scripts.choose_slot
      - name: Restore state and current slot
        if: env.PLAN_ACTIVE == 'true'
        id: state
        run: python -m scripts.cloud_state
      - name: Recover ready video from its public backup if needed
        if: env.PLAN_ACTIVE == 'true'
        run: python -m scripts.catalog recover
      - name: Validate weekly Claude packet
        if: env.PLAN_ACTIVE == 'true' && env.VERIFY_ONLY != 'true'
        run: python -m scripts.check_plan
      - name: Install FFmpeg and fonts
        if: env.PLAN_ACTIVE == 'true' && env.VERIFY_ONLY != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Create video from prepared script
        if: env.PLAN_ACTIVE == 'true' && env.VERIFY_ONLY != 'true'
        run: python -m app.main generate
      - name: Create preview
        if: env.PLAN_ACTIVE == 'true' && env.VERIFY_ONLY != 'true'
        run: python -m scripts.preview
      - name: Save public video in approved GitHub Releases
        if: env.PLAN_ACTIVE == 'true' && env.VERIFY_ONLY != 'true'
        run: python -m scripts.release_video
      - name: Prepare Instagram scheduling and durable intent
        if: env.PLAN_ACTIVE == 'true' && env.VERIFY_ONLY != 'true'
        id: publication
        run: python -m scripts.schedule_instagram prepare
      - name: Save prepared publication metadata
        if: env.PLAN_ACTIVE == 'true' && steps.publication.outputs.create == 'true'
        run: python -m scripts.catalog save
      - name: Checkpoint before remote post creation
        if: env.PLAN_ACTIVE == 'true' && steps.publication.outputs.create == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reelagent-state
          overwrite: true
          path: |
            data/reelagent.db
            data/week-cache/
            data/catalog/
            output/
          retention-days: 1
      - name: Send ready video to Instagram schedule
        if: env.PLAN_ACTIVE == 'true' && steps.publication.outputs.create == 'true'
        run: python -m scripts.schedule_instagram submit
      - name: Verify actual Instagram publication
        if: env.PLAN_ACTIVE == 'true' && env.VERIFY_ONLY == 'true'
        run: python -m scripts.schedule_instagram verify
      - name: Update durable video catalog
        if: always() && env.PLAN_ACTIVE == 'true' && steps.state.outcome == 'success'
        run: python -m scripts.catalog save
      - name: Save durable state even after a publishing error
        if: always() && env.PLAN_ACTIVE == 'true' && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reelagent-state
          overwrite: true
          path: |
            data/reelagent.db
            data/week-cache/
            data/catalog/
            output/
          retention-days: 1
          if-no-files-found: warn
      - name: Downloadable MP4 and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 1
          if-no-files-found: ignore
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          retention-days: 1
          if-no-files-found: ignore
