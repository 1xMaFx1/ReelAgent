name: Daily Reel
run-name: ReelAgent ${{ inputs.request_id || github.run_id }}
on:
  schedule:
    # Generate at 04:17 UTC+3, retry at 06:17; daily state prevents duplicates.
    - cron: '17 1,3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'generate never publishes; run respects repository variables'
        type: choice
        options: [generate, run]
        default: generate
      request_id:
        description: 'Identifier from the one-click launcher'
        type: string
        required: false
      repair_draft:
        description: 'Explicitly replace today unpublished draft after editorial review'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: reelagent-daily
  cancel-in-progress: false
jobs:
  reel:
    if: github.event_name != 'schedule' || vars.DAILY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: cloud
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'ollama' }}
      MEDIA_PROVIDER: nasa
      OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen3:8b' }}
      CONTENT_BRIEF_FILE: ${{ vars.CONTENT_BRIEF_FILE || '' }}
      EPISODE_FILE: ''
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'ru-RU-DmitryNeural' }}
      DRY_RUN: 'true'
      AUTO_PUBLISH_YOUTUBE: 'false'
      AUTO_PUBLISH_INSTAGRAM: 'false'
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
      YOUTUBE_PUBLISHER: ${{ vars.YOUTUBE_PUBLISHER || 'buffer' }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || 'UCr74LNUyePqX4CLS9sI5IPg' }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      PUBLICATION_TIMEZONE: Europe/Simferopol
      PUBLICATION_HOUR: '8'
      PUBLICATION_MINUTE: '0'
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v24.0' }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Start free open model on cloud CPU
        if: env.LLM_PROVIDER == 'ollama' && env.EPISODE_FILE == ''
        run: |
          docker run -d --name reelagent-ollama -p 127.0.0.1:11434:11434 ollama/ollama:latest
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then break; fi
            sleep 2
          done
          docker exec reelagent-ollama ollama pull "$OLLAMA_MODEL"
      - name: Restore durable daily state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cloud_state.py
      - name: Replace unpublished draft only on explicit manual request
        if: github.event_name == 'workflow_dispatch' && inputs.repair_draft
        run: python -m scripts.repair_draft
      - name: Generate daily reel
        env:
          REEL_COMMAND: generate
        run: python -m app.main "$REEL_COMMAND"
      - name: Create downloadable preview
        run: python -m scripts.preview
      - name: Save history and current video even if publication failed
        if: always() && steps.state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reelagent-state
          overwrite: true
          path: |
            data/reelagent.db
            output/
          retention-days: 7
          if-no-files-found: warn
      - name: Downloadable MP4 and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          retention-days: 1
          if-no-files-found: ignore
